<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="-5.5 -5.5 75 75">
  <!--
    L'icône de l'application : la tuile en verre de
    src/web/public/favicons/favicon-glassmorphism.svg, figée au sommet de son
    animation (note relevée de 3, inclinée de 3°, halo violet), sur fond
    transparent.

    Retouches du dessin de la double croche :
    - les hampes s'arrêtent dans la première barre au lieu de dépasser de son
      bord supérieur (le petit arrondi qui pointait en haut à droite) ;
    - les têtes sont dessinées par-dessus les hampes, qui ne se voient plus
      traverser les têtes ;
    - hampes et barres s'alignent sur le bord droit des têtes, sans saillie.
  -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="noteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="halo" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#c084fc" flood-opacity="0.7"/>
    </filter>
    <!-- Le halo reste dans la tuile : rien ne déborde sur le fond transparent. -->
    <clipPath id="tile"><rect x="2" y="2" width="60" height="60" rx="16"/></clipPath>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)"/>
  <path d="M 2 18 C 2 8, 8 2, 18 2 L 46 2 C 56 2, 62 8, 62 18 L 62 27 C 42 35, 24 29, 2 18 Z" fill="#ffffff" fill-opacity="0.12"/>
  <g clip-path="url(#tile)"><g filter="url(#halo)">
    <g filter="url(#glow)" transform="translate(0 -3) rotate(3 32 32)" fill="url(#noteGrad)">
      <rect x="22.76" y="16" width="3.5" height="29.15"/>
      <rect x="46.76" y="11" width="3.5" height="28.15"/>
      <polygon points="22.76,14 50.26,8 50.26,13.5 22.76,19.5"/>
      <polygon points="22.76,21.5 50.26,15.5 50.26,21 22.76,27"/>
      <ellipse cx="20" cy="46" rx="6.5" ry="5" transform="rotate(-25 20 46)"/>
      <ellipse cx="44" cy="40" rx="6.5" ry="5" transform="rotate(-25 44 40)"/>
    </g>
  </g></g>
  <!-- Le liseré par-dessus le halo, comme sur la tuile d'origine. -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
</svg>
