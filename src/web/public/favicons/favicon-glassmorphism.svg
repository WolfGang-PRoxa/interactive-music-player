<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="noteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <style>
      @keyframes floatBounce {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-3px) rotate(3deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.8; filter: drop-shadow(0 0 2px #38bdf8); }
        50% { opacity: 1; filter: drop-shadow(0 0 6px #c084fc); }
      }
      .note-group {
        transform-origin: 32px 32px;
        animation: floatBounce 2.4s ease-in-out infinite, pulseGlow 1.8s ease-in-out infinite;
      }
      .glass-shine {
        animation: pulseGlow 3s ease-in-out infinite alternate;
      }
    </style>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5"/>
  <path class="glass-shine" d="M 2 18 C 2 8, 8 2, 18 2 L 46 2 C 56 2, 62 8, 62 18 L 62 27 C 42 35, 24 29, 2 18 Z" fill="rgba(255, 255, 255, 0.12)"/>
  <g class="note-group" filter="url(#glow)" transform="translate(32, 28) scale(1.16) translate(-32, -28)">
    <ellipse cx="20" cy="46" rx="6.5" ry="5" transform="rotate(-25 20 46)" fill="url(#noteGrad)"/>
    <ellipse cx="44" cy="40" rx="6.5" ry="5" transform="rotate(-25 44 40)" fill="url(#noteGrad)"/>
    <rect x="23" y="14" width="3.5" height="32" rx="1.5" fill="url(#noteGrad)"/>
    <rect x="47" y="8" width="3.5" height="32" rx="1.5" fill="url(#noteGrad)"/>
    <polygon points="23,14 50.5,8 50.5,13.5 23,19.5" fill="url(#noteGrad)"/>
    <polygon points="23,21.5 50.5,15.5 50.5,21 23,27" fill="url(#noteGrad)"/>
  </g>
</svg>
