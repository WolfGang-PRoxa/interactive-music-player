<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d021a"/>
      <stop offset="100%" stop-color="#05000b"/>
    </linearGradient>
    <linearGradient id="noteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="50%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#ffe600"/>
    </linearGradient>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes cyberBeat {
        0%, 100% { transform: scale(1) rotate(0deg); }
        25% { transform: scale(1.06) rotate(-2deg); }
        50% { transform: scale(0.97) rotate(2deg); }
        75% { transform: scale(1.04) rotate(-1deg); }
      }
      @keyframes neonBorder {
        0%, 100% { stroke: #ff007f; filter: drop-shadow(0 0 3px #ff007f); }
        50% { stroke: #00f3ff; filter: drop-shadow(0 0 5px #00f3ff); }
      }
      @keyframes cornerFlash {
        0%, 100% { opacity: 1; stroke: #00f3ff; }
        50% { opacity: 0.4; stroke: #ffe600; }
      }
      .cyber-note {
        transform-origin: 32px 32px;
        animation: cyberBeat 1.2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      .border-rect {
        animation: neonBorder 1.5s linear infinite;
      }
      .corners {
        animation: cornerFlash 0.8s ease-in-out infinite alternate;
      }
    </style>
  </defs>
  <rect class="border-rect" x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#ff007f" stroke-width="2"/>
  <path class="corners" d="M 2 14 L 14 2 M 50 2 L 62 14 M 62 50 L 50 62 M 14 62 L 2 50" stroke="#00f3ff" stroke-width="1.5" fill="none"/>
  <g class="cyber-note" filter="url(#neonGlow)" transform="translate(32, 28) scale(1.16) translate(-32, -28)">
    <ellipse cx="20" cy="46" rx="6.5" ry="5" transform="rotate(-25 20 46)" fill="url(#noteGrad)"/>
    <ellipse cx="44" cy="40" rx="6.5" ry="5" transform="rotate(-25 44 40)" fill="url(#noteGrad)"/>
    <rect x="23" y="14" width="3.5" height="32" rx="1.5" fill="url(#noteGrad)"/>
    <rect x="47" y="8" width="3.5" height="32" rx="1.5" fill="url(#noteGrad)"/>
    <polygon points="23,14 50.5,8 50.5,13.5 23,19.5" fill="url(#noteGrad)"/>
    <polygon points="23,21.5 50.5,15.5 50.5,21 23,27" fill="url(#noteGrad)"/>
  </g>
</svg>
