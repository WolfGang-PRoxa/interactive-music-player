<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <style>
      @keyframes smoothFloat {
        0%, 100% { transform: translateY(0px); opacity: 0.9; }
        50% { transform: translateY(-2px); opacity: 1; }
      }
      @keyframes borderBreathe {
        0%, 100% { stroke: #3f3f46; }
        50% { stroke: #71717a; }
      }
      .minimal-note {
        transform-origin: 32px 32px;
        animation: smoothFloat 2s ease-in-out infinite;
      }
      .minimal-bg {
        animation: borderBreathe 3s ease-in-out infinite;
      }
    </style>
  </defs>
  <rect class="minimal-bg" x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#3f3f46" stroke-width="1.5"/>
  <g class="minimal-note" fill="#fafafa" transform="translate(32, 28) scale(1.16) translate(-32, -28)">
    <ellipse cx="20" cy="46" rx="6.5" ry="5" transform="rotate(-25 20 46)"/>
    <ellipse cx="44" cy="40" rx="6.5" ry="5" transform="rotate(-25 44 40)"/>
    <rect x="23" y="14" width="3.5" height="32" rx="1.5"/>
    <rect x="47" y="8" width="3.5" height="32" rx="1.5"/>
    <polygon points="23,14 50.5,8 50.5,13.5 23,19.5"/>
    <polygon points="23,21.5 50.5,15.5 50.5,21 23,27"/>
  </g>
</svg>
