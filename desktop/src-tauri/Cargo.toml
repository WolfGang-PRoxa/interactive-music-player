[package]
name = "interactive-music-player-desktop"
version = "0.0.4"
description = "Application de bureau du bot Interactive Music Player"
authors = ["WolfGang-PRoxa"]
license = "MIT"
edition = "2021"
rust-version = "1.90"

[lib]
name = "imp_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
ureq = { version = "2", features = ["json", "native-certs"] }
tungstenite = "0.26"
tar = "0.4"
flate2 = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
