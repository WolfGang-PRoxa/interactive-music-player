# Construit l'application de bureau (desktop/) pour Windows et Linux.
#
# Chaque système construit la sienne : la charge utile embarque les binaires que
# npm télécharge pour la machine qui l'exécute — FFmpeg, yt-dlp, le chiffrement
# DAVE. Voir desktop/scripts/build-payload.js.
#
# Les fichiers sortent en artefacts du run. Deux façons de publier en plus la
# release correspondante, avec les notes de `.github/releases/<tag>.md` et une
# empreinte SHA-256 par fichier :
#  - pousser une étiquette `v*` ;
#  - lancer le workflow à la main depuis l'onglet Actions en remplissant
#    « release » (`v0.0.1`, par exemple) : l'étiquette est alors créée sur le
#    commit construit.
# Si la release existe déjà (créée depuis l'interface de GitHub, par exemple),
# les fichiers y sont joints.

name: Application de bureau

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Étiquette de la release à publier (v0.0.1…) ; vide = simple construction"
        required: false
        default: ''
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Même ligne que le Node embarqué : un module natif compilé par npm doit
      # l'être pour la version qui le chargera.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Outils de construction
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: Charge utile (Node et bot)
        run: node desktop/scripts/build-payload.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tests de l'application
        working-directory: desktop/src-tauri
        run: cargo test --locked

      - name: Installeur
        working-directory: desktop
        run: npx tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: interactive-music-player-windows
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # Ubuntu 22.04 plutôt que la plus récente : un AppImage ne démarre que sur une
  # glibc au moins aussi récente que celle qui l'a construit.
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Bibliothèques système (WebKitGTK, zone de notification)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf libfuse2 xdg-utils file

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Outils de construction
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: Charge utile (Node et bot)
        run: node desktop/scripts/build-payload.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tests de l'application
        working-directory: desktop/src-tauri
        run: cargo test --locked

      - name: AppImage et paquet .deb
        working-directory: desktop
        run: npx tauri build --bundles appimage,deb

      - uses: actions/upload-artifact@v4
        with:
          name: interactive-music-player-linux
          path: |
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release, 'v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # GitHub remplace les espaces des noms de fichiers joints par des points :
      # autant leur donner tout de suite un nom sans espace.
      - name: Noms et empreintes
        working-directory: dist
        run: |
          for file in *; do
            renamed="${file// /-}"
            [ "$file" = "$renamed" ] || mv "$file" "$renamed"
          done
          sha256sum * > SHA256SUMS.txt
          ls -l
          cat SHA256SUMS.txt

      - name: Publier la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release || github.ref_name }}
        run: |
          notes=".github/releases/${TAG}.md"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          elif [ -f "$notes" ]; then
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "Interactive Music Player ${TAG#v}" --notes-file "$notes"
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "Interactive Music Player ${TAG#v}" --generate-notes
          fi
