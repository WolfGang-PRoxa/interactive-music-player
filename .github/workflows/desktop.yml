# Construit l'installeur Windows de l'application de bureau (desktop/).
#
# Sur Windows et nulle part ailleurs : la charge utile embarque les binaires que
# npm télécharge pour la machine qui l'exécute — FFmpeg, yt-dlp, le chiffrement
# DAVE. Voir desktop/scripts/build-payload.js.
#
# L'installeur sort en artefact du run ; à la publication d'une release, il est
# aussi joint à celle-ci.

name: Application de bureau

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Même ligne que le Node embarqué : un module natif compilé par npm doit
      # l'être pour la version qui le chargera.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Outils de construction
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: Charge utile (Node et bot)
        run: node desktop/scripts/build-payload.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tests de l'application
        working-directory: desktop/src-tauri
        run: cargo test --locked

      - name: Installeur
        working-directory: desktop
        run: npx tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: interactive-music-player-windows
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Joindre l'installeur à la release
        if: github.event_name == 'release'
        shell: bash
        run: gh release upload "${{ github.event.release.tag_name }}" desktop/src-tauri/target/release/bundle/nsis/*.exe --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
