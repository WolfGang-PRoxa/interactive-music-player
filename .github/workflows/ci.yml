name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # youtube-dl-exec and ffmpeg-static download their binaries from GitHub
      # during install: the token keeps that clear of the anonymous rate limit.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # tests/videoDownload.js reads back the file it writes with ffprobe,
      # which ffmpeg-static does not ship.
      - name: ffprobe
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Formatting and lint
        run: npm run check

      - name: Tests
        run: npm test
